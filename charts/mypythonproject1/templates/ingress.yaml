{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mypythonproject1.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mypythonproject1.labels" . | nindent 4 }}
  annotations:
    {{- $annotations := dict }}
    {{- range $k, $v := .Values.ingress.annotations }}
    {{- if $v }}
    {{- $_ := set $annotations $k $v }}
    {{- end }}
    {{- end }}
    {{- toYaml $annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{ if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{ end }}
      http:
        paths:
          # Backend API routes (no /api prefix in FastAPI)
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: {{ include "mypythonproject1.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /games
            pathType: Prefix
            backend:
              service:
                name: {{ include "mypythonproject1.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "mypythonproject1.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          # All other routes → frontend (SPA)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mypythonproject1.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
